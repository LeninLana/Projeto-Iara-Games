<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- linkando o html com o css -->
    <link rel="stylesheet" href="../CSS/general-style.css">
    <link rel="stylesheet" href="../CSS/form-style.css">

    <!-- fonte dos títulos e textos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=New+Amsterdam&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- icone da pagina -->
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">

    <title>Cadastro | Iara Games</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">



</head>

<body>

    <!-- NAVBAR -->
    <header>
        <!-- cabecalho -->
        <nav class="navbar navbar-expand-lg">
            <div class="container container-fluid">
                <a class="navbar-brand" href="#">
                    <span>Iara Games</span>
                    <img src="../images/logo.svg" alt="Logo Iara Games">
                </a>
                <div class="collapse navbar-collapse" id="navbarText">
                    <ul class="navbar-nav ms-auto mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="../../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../../index.html">Loja</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Entrar</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- fim do cabecalho -->
    </header>

    <!-- MAIN -->
    <main>

        <section class="container-sm">

            <h2 class="register-title">
                Criar conta
            </h2>

            <!-- FORM BOX -->
            <div class="register-box">

                <h2 class="form-title">
                    Dados do usuário
                </h2>

                <form>

                    <div class="row g-4">

                        <!-- NOME -->
                        <div class="col-12">

                            <div class="input-wrapper">

                                <input type="text" class="form-control custom-input" placeholder="Nome de jogador">

                                <i class="bi bi-person-fill input-icon"></i>

                            </div>

                        </div>

                        <!-- EMAIL -->
                        <div class="col-md-6">

                            <div class="input-wrapper">

                                <input type="email" class="form-control custom-input" placeholder="E-mail">

                                <i class="bi bi-at input-icon"></i>

                            </div>

                        </div>

                        <!-- NASCIMENTO -->
                        <div class="col-md-6">

                            <div class="input-wrapper">

                                <input type="date" class="form-control custom-input">

                            </div>

                        </div>

                        <!-- SENHA -->
                        <div class="col-md-6">

                            <div class="input-wrapper">

                                <input type="password" class="form-control custom-input" placeholder="Senha">

                                <i class="bi bi-key-fill input-icon"></i>

                            </div>

                        </div>

                        <!-- TELEFONE -->
                        <div class="col-md-6">

                            <div class="input-wrapper">

                                <input type="tel" class="form-control custom-input" placeholder="Telefone">

                                <i class="bi bi-telephone-fill input-icon"></i>

                            </div>

                        </div>

                    </div>

                    <!-- BOTÃO -->
                    <div class="text-end mt-5">

                        <button type="submit" class="btn button-primary">

                            Criar conta

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>
</body>

</html>
