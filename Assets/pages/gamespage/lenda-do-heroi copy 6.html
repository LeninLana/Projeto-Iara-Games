<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- fonte dos títulos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&display=swap" rel="stylesheet">

    <!-- fonte dos textos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=New+Amsterdam&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- icone da pagina -->
    <link rel="icon" href="/Assets/Images/favicon.ico" type="image/x-icon">

    <!-- linkando o bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>A Lenda do Herói</title>

    <link rel="stylesheet" href="/Assets/CSS/gamepage-style.css">

</head>
<body>

    <!-- PÁGINA -->
    <main class="game-page heroi-page">

        <!-- OVERLAY -->
        <div class="game-overlay"></div>

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg navbar-transparent">

            <div class="container">

                <!-- LOGO -->
                <a class="navbar-brand d-flex align-items-center gap-2"
                    href="/index.html">

                    IARA GAMES

                    <img src="/Assets/images/logo.svg"
                        alt="Logo Iara Games"
                        class="logo-icon">

                </a>

                <!-- MENU -->
                <div class="collapse navbar-collapse">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="/index.html">
                                Início
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                Loja
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Entrar
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

        <!-- CONTEÚDO -->
        <section class="game-content">

            <div class="container">

                <div class="row align-items-center g-5">

                    <!-- IMAGEM -->
                    <div class="col-lg-7">

                        <div class="banner-wrapper">

                            <img src="/Assets/images/banners/lenda-do-heroi.png"
                                alt="Banner do jogo"
                                class="img-fluid game-banner">

                        </div>

                    </div>

                    <!-- INFO -->
                    <div class="col-lg-5">

                        <div class="game-info-box">

                            <h1 class="game-title">

                                A LENDA DO HERÓI

                            </h1>

                            <div class="game-tags">

                                <span>FPS</span>
                                <span>PC</span>
                                <span>Arcade</span>

                            </div>

                            <div class="game-buttons">

                                <button class="btn favorite-btn">

                                    ☆

                                </button>

                                <button class="btn buy-btn">

                                    Comprar

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
